[project]
name = "lukeschiefelbein-site"
version = "0.1.0"
description = "Build tools for www.lukeschiefelbein.com"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pyyaml>=6.0",
    "marimo>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pillow>=11.0",
    "matplotlib>=3.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
